{{/*
One Role per target namespace, granting management of the single secret named in
targetSecret.name. "create" cannot be scoped by resourceNames, because the object
does not exist when the request is authorized.

The release namespace needs no Role: the Crusoe API credentials reach the pod through
secretKeyRef, which the kubelet resolves, so the ServiceAccount never reads that secret
through the API.
*/}}
{{- if .Values.rbac.create }}
{{- range $ns := .Values.targetSecret.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "crusoe-registry-token-rotator.fullname" $ }}-{{ $ns }}
  namespace: {{ $ns }}
  labels:
    {{- include "crusoe-registry-token-rotator.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "update", "patch"]
    resourceNames:
      - {{ $.Values.targetSecret.name | quote }}
{{- end }}
{{- end }}
