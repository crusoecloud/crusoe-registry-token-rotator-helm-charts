apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "crusoe-registry-token-rotator.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "crusoe-registry-token-rotator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - "secrets"
    verbs:
      - "get"
