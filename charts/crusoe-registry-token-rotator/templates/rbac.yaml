apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "crusoe-registry-token-rotator.serviceAccountName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "crusoe-registry-token-rotator.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "crusoe-registry-token-rotator.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "crusoe-registry-token-rotator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - "secrets"
    verbs:
      - "get"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "crusoe-registry-token-rotator.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "crusoe-registry-token-rotator.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "crusoe-registry-token-rotator.serviceAccountName" . }}
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: {{ include "crusoe-registry-token-rotator.fullname" . }}
  apiGroup: rbac.authorization.k8s.io

---
# Cluster-wide permission to manage the target PAT secret in any namespace.
# A single ClusterRole/ClusterRoleBinding is used instead of a Role/RoleBinding
# per target namespace so the chart does not scale linearly with the number of
# namespaces.
#
# `create` cannot be constrained by resourceNames (the object name is unknown
# at admission time), so it is granted unbounded. `get`/`update`/`patch` are
# limited to the configured target secret name.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "crusoe-registry-token-rotator.fullname" . }}
  labels:
    {{- include "crusoe-registry-token-rotator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - "secrets"
    verbs:
      - "create"
  - apiGroups:
      - ""
    resources:
      - "secrets"
    verbs:
      - "get"
      - "update"
      - "patch"
    resourceNames:
      - {{ .Values.targetSecret.name | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "crusoe-registry-token-rotator.fullname" . }}
  labels:
    {{- include "crusoe-registry-token-rotator.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "crusoe-registry-token-rotator.serviceAccountName" . }}
    namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "crusoe-registry-token-rotator.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
