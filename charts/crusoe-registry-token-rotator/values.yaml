# -- Image configuration for the token rotation container
image:
  repository: ghcr.io/crusoecloud/crusoe-registry-token-rotator
  tag: "latest"
  pullPolicy: Always

# -- Override the full name of resources created by this chart
fullnameOverride: ""
# -- Override the base name of resources created by this chart
nameOverride: ""

# -- Schedule to run the job. Default is every 30 days at 1 AM UTC.
# See https://crontab.guru/ for help with cron syntax.
schedule: "0 */6 * * *"
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 1
# -- DEPRECATED. Resources are installed into the release namespace; use
# "helm install --namespace" instead. Leave empty. If set to anything other
# than the release namespace, rendering fails rather than relocating your
# resources silently. This key is removed in 2.0.0.
namespace: ""
# -- Resource requests and limits for the CronJob container
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

# -- Service account and RBAC configuration
serviceAccount:
  # -- If true, create the ServiceAccount plus the ClusterRole and a RoleBinding
  # in every namespace listed in targetSecret.namespaces. If false, none of them
  # are created and name below must identify an account you have bound yourself.
  create: true
  # -- The name of the ServiceAccount to use. If empty, a name is derived from
  # the release.
  name: ""

# -- DEPRECATED. Use serviceAccount.create and serviceAccount.name instead.
# These keys still take effect when set, and override the ones above, but they
# are removed in 2.0.0. Leave them unset.
rbac:
  create: null
  serviceAccount:
    name: null

# -- Crusoe credentials secret name (must contain CRUSOE_ACCESS_KEY and CRUSOE_SECRET_KEY)
crusoeCredentialsSecretName: "crusoe-secrets"

# -- Configuration for the token generation script
token:
  # -- The lifetime of the generated token in hours.
  # The cron schedule should be less than this to ensure an overlap.
  expirationHours: 12
  # -- An alias for the token created in the Crusoe UI
  alias: "k8s-cronjob-token-api"

# -- The target secret that will be created or updated with the token
targetSecret:
  # -- The name of the secret that will store the generated PAT token.
  name: "crusoe-image-pull-secrets"
  # -- The namespaces (list) where the secret will be created/updated. If empty, defaults to ["default"].
  namespaces:
    - "default"
  # -- The container registry URL for this secret
  registryUrl: ""
  # -- The registry username for this secret
  registryUsername: ""
